version: "3.9"

services:
  api:
    # TODO Entrega 2: reemplazar por el build real de la API (Dockerfile propio)
    image: hashicorp/http-echo
    command: ["-text=API placeholder - reemplazar en Entrega 2", "-listen=:3000"]
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
      - API_KEY=${API_KEY}
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy

  worker:
    # TODO Entrega 2: consumidor que genera la OrdenCocina al recibir pedido.confirmado
    image: hashicorp/http-echo
    command: ["-text=Worker placeholder - reemplazar en Entrega 2", "-listen=:3001"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-restaurante}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-restaurante}
      - POSTGRES_DB=${POSTGRES_DB:-restaurante}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-restaurante}"]
      interval: 5s
      timeout: 5s
      retries: 5

  broker:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Panel de administración
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-restaurante}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-restaurante}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  db_data:
