services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    init: true
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATABASE_URL=${DATABASE_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
      - API_KEY=${API_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 5
    stop_grace_period: 15s

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    init: true
    ports:
      - "3001:3001"
    environment:
      - WORKER_PORT=3001
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATABASE_URL=${DATABASE_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}
      # El gateway WebSocket valida localmente los JWT (JWKS); no recibe secretos M2M.
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 5
    stop_grace_period: 15s

  migrate:
    build:
      context: .
      dockerfile: api/Dockerfile
    init: true
    command: ["npm", "run", "db:migrate"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16.15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-restaurante}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-restaurante}
      - POSTGRES_DB=${POSTGRES_DB:-restaurante}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  broker:
    image: rabbitmq:4.3.6-management-alpine
    # Hostname fijo: RabbitMQ guarda sus datos bajo el nombre del nodo (rabbit@broker).
    hostname: broker
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Panel de administración
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-restaurante}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-restaurante}
    volumes:
      - broker_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api
      - worker

  grafana:
    image: grafana/grafana:13.3.0
    ports:
      - "3002:3000"   # 3000 y 3001 son de API y worker
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      # Lectura sin login para la demo; editar requiere el usuario administrador.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/restaurante.json
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  db_data:
  broker_data:
  prometheus_data:
  grafana_data:
