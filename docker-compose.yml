services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    init: true
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATABASE_URL=${DATABASE_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
      - API_KEY=${API_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 5
    stop_grace_period: 15s

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    init: true
    ports:
      - "3001:3001"
    environment:
      - WORKER_PORT=3001
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATABASE_URL=${DATABASE_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 5
    stop_grace_period: 15s

  migrate:
    build:
      context: .
      dockerfile: api/Dockerfile
    init: true
    command: ["npm", "run", "db:migrate"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16.15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-restaurante}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-restaurante}
      - POSTGRES_DB=${POSTGRES_DB:-restaurante}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  broker:
    image: rabbitmq:4.3.6-management-alpine
    # Hostname fijo: RabbitMQ guarda sus datos bajo el nombre del nodo (rabbit@broker).
    hostname: broker
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Panel de administración
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-restaurante}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-restaurante}
    volumes:
      - broker_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  db_data:
  broker_data:
