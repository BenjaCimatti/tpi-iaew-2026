          broker: up
  responses:
    '400':
      description: UUID, body, filtro o JSON inválido
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '401':
      description: Token ausente o inválido
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '403':
      description: Scope insuficiente
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '404':
      description: Recurso, mesa o producto inexistente
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '409':
      description: Estado incompatible, producto no disponible o recurso referenciado
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '413':
      description: Body mayor a 64 KB
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '500':
      description: Error interno
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
    '503':
      description: DB o configuración de Auth0 no disponible
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Solo para GET /health-protegido; no autoriza los CRUD.
    bearerAuth:
      type: oauth2
      description: 'Auth0: client_credentials, JWT RS256 validado mediante JWKS.'
      flows:
        clientCredentials:
          tokenUrl: https://dev-6qbph7he6b6cur0j.us.auth0.com/oauth/token
          scopes:
            read:pedidos: Consultar productos y pedidos
            write:pedidos: Crear, editar, eliminar y cancelar pedidos pendientes; entregar pedidos listos
            admin:productos: Administrar productos
            confirm:pedidos: Confirmar pedidos
            read:cocina: Consultar órdenes de cocina y suscribirse al tablero WebSocket
            write:cocina: Avanzar el estado de las órdenes de cocina
x-websocket: >-
  ws://localhost:3001/ws/cocina (worker). Autenticación con un mensaje
  {"type":"auth","token":"..."} y scope read:cocina; contrato en docs/websocket.md.
x-correlation-id: Se acepta un UUID en x-correlation-id; se genera uno si está ausente
  y se devuelve en el header. Formato inválido devuelve 400.
