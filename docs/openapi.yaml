        catálogo y se conservan para productos retenidos al editar.
      properties:
        mesaId:
          type: string
          format: uuid
        items:
          type: array
          minItems: 1
          items:
            "$ref": "#/components/schemas/ItemPedidoInput"
      example:
        mesaId: b3f1a2e0-1111-4a2b-9c3d-000000000001
        items:
