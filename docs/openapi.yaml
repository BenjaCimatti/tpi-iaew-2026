---
openapi: 3.1.0
info:
  title: API de Pedidos de Restaurante
  version: 1.0.0
  description: CRUD de Productos y Pedidos y confirmación multi-paso con
    JWT/scopes de Auth0. Endpoint de comparación protegido exclusivamente con
    API key (E2-04). Los eventos asíncronos se documentan en docs/eventos.md.
servers:
- url: http://localhost:3000
security:
- bearerAuth: []
tags:
- name: Productos
  description: Productos del restaurante
- name: Pedidos
  description: Pedidos del restaurante
- name: Cocina
  description: Órdenes de cocina; el tablero en vivo usa WebSocket (docs/websocket.md)
- name: Salud
  description: Salud del restaurante
paths:
  "/health":
    get:
      summary: Comprobar conexiones; no verifica el flujo de negocio
      security: []
      servers:
      - url: http://localhost:3000
      - url: http://localhost:3001
      responses:
        '200':
          description: Dependencias disponibles
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Salud"
        '503':
          description: Una o ambas dependencias no disponibles
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Salud"
      operationId: get_health
      tags:
      - Salud
  "/health-protegido":
    get:
      summary: Comprobar conexiones con API key; no verifica el flujo de negocio
      operationId: get_health_protegido
      tags:
      - Salud
      security:
      - apiKeyAuth: []
      responses:
        '200':
          description: Dependencias disponibles
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Salud"
        '401':
          "$ref": "#/components/responses/401"
        '503':
          description: Dependencias no disponibles (Salud) o API key sin configurar (Error)
          content:
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/Salud"
                - "$ref": "#/components/schemas/Error"
  "/productos":
    get:
      summary: Listar productos
      security:
      - bearerAuth:
        - read:pedidos
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Producto"
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
      operationId: get_productos
      tags:
      - Productos
    post:
      summary: Crear producto
      security:
      - bearerAuth:
        - admin:productos
      responses:
        '201':
          description: Operación exitosa
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Producto"
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
        '404':
          "$ref": "#/components/responses/404"
        '409':
          "$ref": "#/components/responses/409"
        '413':
          "$ref": "#/components/responses/413"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProductoInput"
      operationId: post_productos
      tags:
      - Productos
  "/productos/{productoId}":
    parameters:
    - name: productoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Consultar producto
      security:
      - bearerAuth:
        - read:pedidos
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Producto"
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
        '404':
          "$ref": "#/components/responses/404"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
      operationId: get_productos_productoId
      tags:
      - Productos
    put:
      summary: Actualizar producto
      description: Requiere nombre y precio. Conserva descripción, categoría y disponibilidad si se omiten; enviar null explícito para vaciar descripción o categoría.
      security:
      - bearerAuth:
        - admin:productos
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Producto"
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
        '404':
          "$ref": "#/components/responses/404"
        '409':
          "$ref": "#/components/responses/409"
        '413':
          "$ref": "#/components/responses/413"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProductoInput"
      operationId: put_productos_productoId
      tags:
      - Productos
    patch:
      summary: Modificar únicamente el precio de un producto
      description: Conserva nombre, descripción, categoría y disponibilidad. No cambia los precios históricos de los pedidos.
      operationId: patch_productos_productoId
      tags:
      - Productos
      security:
      - bearerAuth:
        - admin:productos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PrecioProductoInput"
      responses:
        '200':
          description: Producto con el precio actualizado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Producto"
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
        '404':
          "$ref": "#/components/responses/404"
        '413':
          "$ref": "#/components/responses/413"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
    delete:
      summary: Eliminar producto sin referencias
      security:
      - bearerAuth:
        - admin:productos
      responses:
        '204':
          description: Operación exitosa
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
        '404':
          "$ref": "#/components/responses/404"
        '409':
          "$ref": "#/components/responses/409"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
      operationId: delete_productos_productoId
      tags:
      - Productos
  "/pedidos":
    get:
      summary: Listar pedidos
      security:
      - bearerAuth:
        - read:pedidos
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Pedido"
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
      parameters:
      - name: estado
        in: query
        schema:
          type: string
          enum:
          - pendiente
          - confirmado
          - en_preparacion
          - listo
          - entregado
          - cancelado
      operationId: get_pedidos
      tags:
      - Pedidos
    post:
      summary: Crear pedido
      security:
      - bearerAuth:
        - write:pedidos
      responses:
        '201':
          description: Operación exitosa
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Pedido"
          headers:
            Location:
              description: URL del recurso creado
              schema:
                type: string
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
        '404':
          "$ref": "#/components/responses/404"
        '409':
          "$ref": "#/components/responses/409"
        '413':
          "$ref": "#/components/responses/413"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PedidoInput"
      operationId: post_pedidos
      tags:
      - Pedidos
  "/pedidos/{pedidoId}":
    parameters:
    - name: pedidoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Consultar pedido
      security:
      - bearerAuth:
        - read:pedidos
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Pedido"
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
        '404':
          "$ref": "#/components/responses/404"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
      operationId: get_pedidos_pedidoId
      tags:
      - Pedidos
    put:
      summary: Reemplazar pedido pendiente
      security:
      - bearerAuth:
        - write:pedidos
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Pedido"
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
        '404':
          "$ref": "#/components/responses/404"
        '409':
          "$ref": "#/components/responses/409"
        '413':
          "$ref": "#/components/responses/413"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PedidoInput"
      operationId: put_pedidos_pedidoId
      tags:
      - Pedidos
    delete:
      summary: Eliminar pedido pendiente
      security:
      - bearerAuth:
        - write:pedidos
      responses:
        '204':
          description: Operación exitosa
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
        '404':
          "$ref": "#/components/responses/404"
        '409':
          "$ref": "#/components/responses/409"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
      operationId: delete_pedidos_pedidoId
      tags:
      - Pedidos
  "/pedidos/{pedidoId}/cancelar":
    parameters:
    - name: pedidoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      summary: Cancelar únicamente un pedido pendiente; conserva el registro
      security:
      - bearerAuth:
        - write:pedidos
      responses:
        '200':
          description: Operación exitosa
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Pedido"
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
        '404':
          "$ref": "#/components/responses/404"
        '409':
          "$ref": "#/components/responses/409"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
      operationId: post_pedidos_pedidoId_cancelar
      tags:
      - Pedidos
  "/pedidos/{pedidoId}/confirmar":
    parameters:
    - name: pedidoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      summary: Confirmar un pedido pendiente (transacción multi-paso)
      description: >-
        En una única transacción SQL: bloquea el pedido, exige estado `pendiente`
        y al menos un ítem, valida que los productos existan y estén disponibles,
        calcula el total con los precios capturados al crear/editar el pedido,
        guarda estado `confirmado`, total y `confirmadoEn`, y registra el evento
        `pedido.confirmado` en el outbox. Cualquier rechazo revierte todo. El
        evento se publica en RabbitMQ después del commit (ver docs/eventos.md);
        la orden de cocina la crea el worker de forma asíncrona, por lo que no
        forma parte de esta respuesta. El `x-correlation-id` del request se
        propaga al evento.
      security:
      - bearerAuth:
        - confirm:pedidos
      responses:
        '200':
          description: Pedido confirmado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Pedido"
              example:
                id: d4e5f6a0-3333-4a2b-9c3d-000000000003
                mesaId: b3f1a2e0-1111-4a2b-9c3d-000000000001
                estado: confirmado
                total: 17000
                items:
                - productoId: a1c9f0e0-2222-4a2b-9c3d-000000000002
                  cantidad: 2
                  precioUnitario: 8500
                creadoEn: '2026-11-14T18:40:00.000Z'
                confirmadoEn: '2026-11-14T18:42:38.000Z'
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
        '404':
          "$ref": "#/components/responses/404"
        '409':
          description: >-
            `ESTADO_INCOMPATIBLE` (ya confirmado, cancelado u otro estado),
            `PEDIDO_SIN_ITEMS`, `PRODUCTO_NO_DISPONIBLE`, `PRODUCTO_NO_ENCONTRADO`
            o `CANTIDAD_INVALIDA`. El pedido no cambia.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
              example:
                codigo: PRODUCTO_NO_DISPONIBLE
                mensaje: El pedido contiene un producto no disponible
                correlationId: 7b0b5d2e-8f36-4c1a-9d43-2f6f4a1f0c11
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
      operationId: post_pedidos_pedidoId_confirmar
      tags:
      - Pedidos
  "/pedidos/{pedidoId}/entregar":
    parameters:
    - name: pedidoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      summary: Entregar un pedido listo
      description: >-
        El mozo entrega un pedido en estado `listo`: pasa a `entregado` y se
        registra `orden.actualizada` en outbox para que el tablero retire la orden.
      security:
      - bearerAuth:
        - write:pedidos
      responses:
        '200':
          description: Pedido entregado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Pedido"
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
        '404':
          "$ref": "#/components/responses/404"
        '409':
          description: El pedido no está `listo` (`ESTADO_INCOMPATIBLE`)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
      operationId: post_pedidos_pedidoId_entregar
      tags:
      - Pedidos
  "/cocina/ordenes":
    get:
      summary: Listar órdenes de cocina
      description: Incluye las de pedidos entregados; el tablero muestra solo las activas.
      security:
      - bearerAuth:
        - read:cocina
      parameters:
      - name: estado
        in: query
        required: false
        schema:
          "$ref": "#/components/schemas/EstadoOrdenCocina"
      responses:
        '200':
          description: Órdenes ordenadas por fecha de creación
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/OrdenCocina"
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
      operationId: get_cocina_ordenes
      tags:
      - Cocina
  "/cocina/ordenes/{ordenId}":
    parameters:
    - name: ordenId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Consultar una orden de cocina
      security:
      - bearerAuth:
        - read:cocina
      responses:
        '200':
          description: Orden de cocina
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OrdenCocina"
              example:
                id: 85097133-1ecd-4acd-b4ca-dda0b89fa719
                pedidoId: f3c59a3c-5a71-4c43-83f7-cd2f1bea68e8
                estado: en_preparacion
                pedidoEstado: en_preparacion
                mesa: 1
                items:
                - productoId: a1c9f0e0-2222-4a2b-9c3d-000000000002
                  nombre: Milanesa napolitana
                  cantidad: 2
                creadoEn: '2026-11-14T18:42:39.000Z'
                actualizadoEn: '2026-11-14T18:45:10.000Z'
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
        '404':
          "$ref": "#/components/responses/404"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
      operationId: get_cocina_ordenes_ordenId
      tags:
      - Cocina
    patch:
      summary: Avanzar el estado de una orden de cocina
      description: >-
        Solo avanza un paso: `recibida` → `en_preparacion` → `lista`. Sincroniza el
        pedido (`en_preparacion` → pedido `en_preparacion`; `lista` → pedido
        `listo`) y registra `orden.actualizada` en outbox en la misma transacción;
        el gateway WebSocket lo difunde al tablero (ver docs/websocket.md).
        `write:pedidos` no habilita este cambio.
      security:
      - bearerAuth:
        - write:cocina
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - estado
              properties:
                estado:
                  "$ref": "#/components/schemas/EstadoOrdenCocina"
            example:
              estado: en_preparacion
      responses:
        '200':
          description: Orden actualizada
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/OrdenCocina"
              example:
                id: 85097133-1ecd-4acd-b4ca-dda0b89fa719
                pedidoId: f3c59a3c-5a71-4c43-83f7-cd2f1bea68e8
                estado: en_preparacion
                pedidoEstado: en_preparacion
                mesa: 1
                items:
                - productoId: a1c9f0e0-2222-4a2b-9c3d-000000000002
                  nombre: Milanesa napolitana
                  cantidad: 2
                creadoEn: '2026-11-14T18:42:39.000Z'
                actualizadoEn: '2026-11-14T18:45:10.000Z'
        '400':
          "$ref": "#/components/responses/400"
        '401':
          "$ref": "#/components/responses/401"
        '403':
          "$ref": "#/components/responses/403"
        '404':
          "$ref": "#/components/responses/404"
        '409':
          description: Transición no permitida (`TRANSICION_INVALIDA`), p. ej. saltar a `lista` o retroceder
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '500':
          "$ref": "#/components/responses/500"
        '503':
          "$ref": "#/components/responses/503"
      operationId: patch_cocina_ordenes_ordenId
      tags:
      - Cocina
  "/":
    get:
      summary: Alias del healthcheck
      security: []
      servers:
      - url: http://localhost:3000
      - url: http://localhost:3001
      responses:
        '200':
          description: Dependencias disponibles
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Salud"
        '503':
          description: Una o ambas dependencias no disponibles
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Salud"
      operationId: get_root
      tags:
      - Salud
components:
  schemas:
    PrecioProductoInput:
      type: object
      additionalProperties: false
      required:
      - precio
      properties:
        precio:
          "$ref": "#/components/schemas/ProductoInput/properties/precio"
      example:
        precio: 1400
    ProductoInput:
      type: object
      required:
      - nombre
      - precio
      properties:
        nombre:
          type: string
          minLength: 1
        descripcion:
          type:
          - string
          - 'null'
        precio:
          type: number
          minimum: 0
          maximum: 9999999999.99
          multipleOf: 0.01
        categoria:
          type:
          - string
          - 'null'
        disponible:
          type: boolean
          default: true
      example:
        nombre: Producto demo
        precio: 1250.5
        disponible: true
    Producto:
      type: object
      required:
      - id
      - nombre
      - descripcion
      - precio
      - categoria
      - disponible
      - creadoEn
      properties:
        id:
          type: string
          format: uuid
        nombre:
          type: string
          minLength: 1
        descripcion:
          type:
          - string
          - 'null'
        precio:
          type: number
          minimum: 0
          maximum: 9999999999.99
          multipleOf: 0.01
        categoria:
          type:
          - string
          - 'null'
        disponible:
          type: boolean
          default: true
        creadoEn:
          type: string
          format: date-time
      example:
