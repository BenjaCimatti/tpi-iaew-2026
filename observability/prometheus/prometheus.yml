# Recolección de métricas de API y worker cada 5 s (red interna de Compose).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:3000']
  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ['worker:3001']
